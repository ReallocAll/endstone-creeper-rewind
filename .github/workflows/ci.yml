name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install development environment
        run: uv sync --python ${{ matrix.python-version }} --group dev
      - name: Ruff
        run: uv run --no-sync ruff check .
      - name: Tests
        run: uv run --no-sync pytest -q
      - name: Build wheel
        run: uv build --wheel
      - name: Install wheel in clean environment
        run: |
          uv venv .install --python ${{ matrix.python-version }}
          uv pip install --python .install/bin/python --no-deps dist/*.whl
          .install/bin/python tests/verify_wheel.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: creeper-rewind-wheel-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
