name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # Keep Git initialization aligned with the repository's default branch.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Diagnose inherited annotations
        if: matrix.python-version == '3.15'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for check in 114204444688 114204444822 114204444875 114204444876 114204444918; do
            echo "Annotations for check run $check:"
            gh api "repos/${{ github.repository }}/check-runs/$check/annotations" \
              --jq '.[] | {level: .annotation_level, title: .title, message: .message, path: .path, start_line: .start_line}'
          done
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install development environment
        run: uv sync --python ${{ matrix.python-version }} --group dev
      - name: Ruff
        run: uv run --no-sync ruff check .
      - name: Tests
        run: uv run --no-sync pytest -q
      - name: Build wheel
        run: uv build --wheel
      - name: Install wheel in clean environment
        run: |
          uv venv .install --python ${{ matrix.python-version }}
          uv pip install --python .install/bin/python --no-deps dist/*.whl
          .install/bin/python tests/verify_wheel.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: creeper-rewind-wheel-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
